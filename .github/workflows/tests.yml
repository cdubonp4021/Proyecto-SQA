name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "clave-solo-para-pruebas-automatizadas"

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        run: |
          python -m pip install -r requirements-dev.txt
          python -m compileall -q core owners vehicles service_orders maintenance reminders
          python manage.py check --settings=config.settings_test

      - name: Test
        run: python -m coverage run --source=core,owners,vehicles,service_orders,maintenance,reminders --omit="*/migrations/*,*/tests.py,*/tests/*,*/test_*.py" manage.py test --settings=config.settings_test

      - name: Analyze - lint
        run: python -m ruff check core owners vehicles service_orders maintenance reminders

      - name: Analyze - quality gate de cobertura
        run: python -m coverage report -m --fail-under=60

      - name: Report - publicar resumen
        if: always()
        run: |
          if [ -f .coverage ]; then
            python -m coverage report -m | tee coverage-report.txt
            cat coverage-report.txt >> "$GITHUB_STEP_SUMMARY"
            python -m coverage xml
          else
            echo "No se generó el archivo de cobertura." >> "$GITHUB_STEP_SUMMARY"
          fi